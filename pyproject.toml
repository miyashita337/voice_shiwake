[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-shiwake"
version = "0.1.0"
description = "会議動画から話者別議事録を生成しSlackに投稿するツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "miyashita337" }]
dependencies = [
    "assemblyai>=0.33.0",
    "anthropic>=0.40.0",
    "click>=8.1.7",
    "numpy>=1.24,<2.0",
    "resemblyzer>=0.1.4",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "slack-sdk>=3.27.0",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
    "videodb>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
]
# VibeVoice などのローカル TTS を使う場合のみ追加で必要
tts = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
]

[project.scripts]
voice-shiwake = "voice_shiwake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
